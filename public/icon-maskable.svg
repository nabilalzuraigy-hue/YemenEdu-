<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246BB8" />
      <stop offset="50%" stop-color="#1E5AA8" />
      <stop offset="100%" stop-color="#133C73" />
    </linearGradient>
    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="mBookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable (covers entire 512x512 without corner radius) -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Inner safe zone (scale 0.76 centered at 256, 256) -->
  <g transform="translate(61.44, 61.44) scale(0.76)" filter="url(#mShadow)">
    <!-- Subtle Emblem Ring -->
    <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

    <!-- Graduation Cap Board -->
    <path d="M 256 110 L 426 190 L 256 270 L 86 190 Z" fill="url(#mGoldGrad)" />
    <!-- Graduation Cap Skullcap -->
    <path d="M 170 230 L 170 300 C 170 350 342 350 342 300 L 342 230 Z" fill="#D97706" opacity="0.95" />
    <!-- Cap Button & Tassel -->
    <circle cx="256" cy="190" r="10" fill="#FFFFFF" />
    <path d="M 256 190 Q 390 200 400 280" fill="none" stroke="#FDE68A" stroke-width="7" stroke-linecap="round" />
    <rect x="393" y="278" width="14" height="28" rx="4" fill="#FCD34D" />

    <!-- Open Book Below Cap -->
    <!-- Left Page -->
    <path d="M 256 345 C 215 325 160 325 120 342 L 120 422 C 160 405 215 405 256 425 Z" fill="url(#mBookGrad)" />
    <!-- Right Page -->
    <path d="M 256 345 C 297 325 352 325 392 342 L 392 422 C 352 405 297 405 256 425 Z" fill="#F8FAFC" />
    <!-- Book Spine -->
    <path d="M 254 345 L 254 425 L 258 425 L 258 345 Z" fill="#94A3B8" />

    <!-- Book text lines -->
    <path d="M 150 365 Q 190 355 230 365" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 150 385 Q 190 375 230 385" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 282 365 Q 322 355 362 365" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 282 385 Q 322 375 362 385" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>
</svg>
