<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246BB8" />
      <stop offset="50%" stop-color="#1E5AA8" />
      <stop offset="100%" stop-color="#133C73" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Emblem Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Main School / Education Icon Group -->
  <g filter="url(#shadow)">
    <!-- Graduation Cap Board -->
    <path d="M 256 120 L 416 195 L 256 270 L 96 195 Z" fill="url(#goldGrad)" />
    <!-- Graduation Cap Skullcap -->
    <path d="M 176 235 L 176 300 C 176 345 336 345 336 300 L 336 235 Z" fill="#D97706" opacity="0.95" />
    <!-- Cap Button & Tassel -->
    <circle cx="256" cy="195" r="9" fill="#FFFFFF" />
    <path d="M 256 195 Q 380 205 388 280" fill="none" stroke="#FDE68A" stroke-width="6" stroke-linecap="round" />
    <rect x="382" y="278" width="12" height="26" rx="4" fill="#FCD34D" />

    <!-- Open Book Below Cap -->
    <!-- Left Page -->
    <path d="M 256 345 C 220 328 170 328 136 342 L 136 415 C 170 401 220 401 256 418 Z" fill="url(#bookGrad)" />
    <!-- Right Page -->
    <path d="M 256 345 C 292 328 342 328 376 342 L 376 415 C 342 401 292 401 256 418 Z" fill="#F8FAFC" />
    <!-- Book Spine -->
    <path d="M 254 345 L 254 418 L 258 418 L 258 345 Z" fill="#94A3B8" />

    <!-- Book text lines (subtle) -->
    <path d="M 160 362 Q 195 352 232 360" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 160 380 Q 195 370 232 378" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 280 360 Q 317 352 352 362" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 280 378 Q 317 370 352 380" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
